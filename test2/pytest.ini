[pytest]
# No existía ningún pytest.ini/pyproject en el repo original: sin esto,
# pytest tira PytestUnknownMarkWarning por cada marker custom (unit,
# integration, smoke, etc.) y, en entornos con `-W error`, esas warnings
# rompen la corrida.

# IMPORTANTE: correr pytest DESDE ADENTRO de test2/ (o pasando "test2" como
# argumento explícito), nunca desde la raíz del checkout de nfe_alert: los
# checkouts (Agip/, Nacional/, Sicena/) tienen su propia carpeta tests/ con
# scripts manuales (test_manuales.py, test_aislado_salta.py, etc.) pensados
# para correrse a mano contra portales/DB reales, NO aptos para pytest
# automático.
testpaths =
    .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

markers =
    unit: test unitario, sin IO real (DB/red/browser mockeados).
    integration: test de integración (ej. DB SQLite real, varios componentes).
    smoke: chequeo rápido de que un módulo/contrato básico no está roto.
    credentials: escenario relacionado a credenciales inválidas/expiradas.
    timeout: escenario relacionado a timeouts de portal (no de credenciales).
    known_issue: documenta un bug real y conocido del código de la app (no
        de la suite de tests). Puede estar marcado además con xfail(strict=True)
        si se espera que falle hasta que se corrija en jurisdicciones/*.py o
        cliente_processor.py.
    manual_repro: adjunta al reporte HTML los pasos para reproducir el fallo
        a mano (ver hook pytest_runtest_makereport en conftest.py).
    e2e_live: test que pega contra portales reales con credenciales reales.
        Deshabilitado por defecto (ver e2e_live/README_E2E_LIVE.md); sólo
        corre con RUN_LIVE_E2E=true.

# La suite e2e_live ya se autoexcluye vía skip (ver e2e_live/conftest.py)
# incluso sin este filtro, pero lo dejamos explícito acá para que
# `pytest -m "not e2e_live"` funcione como forma corta de excluirla del
# todo (por ejemplo, para que ni siquiera aparezca "skipped" en el reporte).
