[pytest]
asyncio_mode = auto
testpaths = test2
python_files = test_*.py
addopts =
    --ignore=test2/test_aislado_salta.py
    --ignore=test2/test_la_pampa.py
    --ignore=test2/test_manual_catamarca.py
    --ignore=test2/test_connection.py
markers =
    smoke: pruebas rápidas de humo (la app arranca, imports, config básica)
    unit: pruebas unitarias, sin IO real (DB/red/browser)
    integration: pruebas de integración (DB sqlite real, sin browser)
    e2e: pruebas end-to-end con Playwright real contra un servidor local
    e2e_live: pruebas end-to-end contra portales fiscales REALES con
        credenciales reales. Deshabilitadas por defecto, requieren
        RUN_LIVE_E2E=true. Ver tests/e2e_live/README_E2E_LIVE.md.
    known_issue: caracteriza un comportamiento actual del repo que documenta
        un problema conocido (ver TESTS_README.md). No modificar el código de
        producción para "arreglar" estos tests: son alertas para el equipo.
    slow: pruebas que tardan más (ej. esperan un timeout real de 60s)
    credentials: tests relacionados con clasificación de credenciales
    timeout: tests relacionados con manejo de timeouts
    manual_repro: adjunta al reporte HTML los pasos para reproducir el
        fallo manualmente en el navegador, sin correr tests ni leer código
filterwarnings =
    ignore::DeprecationWarning
