name: package-and-release

on:
  push:
    branches:
      - main
    # tags:
    #   - 'v*'   # v1.0.000, v1.0.001, etc.
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write  # necesario para crear/actualizar Releases

jobs:
  package:
    # Ejecutar solo en push o cuando un pull_request cerrado hacia main fue mergeado
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('autodeploy-%s', github.run_number) }}
      RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtener fecha actual
        run: echo "RELEASE_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Preparar carpeta de entrega (exclude .git y CI)
        run: |
          mkdir -p out/nfe_alert
          shopt -s extglob
          cp -r !(out|.git|.github) out/nfe_alert

      - name: Crear ZIP
        run: |
          cd out
          zip -r "nfe_alert-${RELEASE_DATE}.zip" nfe_alert
          sha256sum "nfe_alert-${RELEASE_DATE}.zip" > "nfe_alert-${RELEASE_DATE}.zip.sha256"

      - name: Publicar en Release (asset)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/nfe_alert-${RELEASE_DATE}.zip
            out/nfe_alert-${RELEASE_DATE}.zip.sha256
          overwrite_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
