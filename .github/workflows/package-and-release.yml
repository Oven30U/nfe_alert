name: package-and-release

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write  # necesario para crear/actualizar Releases

jobs:
  package:
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtener fecha actual
        id: set-date
        run: echo "::set-output name=date::$(date +'%Y%m%d')"

      - name: Preparar carpeta de entrega (exclude .git y CI)
        run: |
          mkdir -p out/nfe_alert
          shopt -s extglob
          cp -r !(out|.git|.github) out/nfe_alert

      - name: Crear ZIP
        run: |
          cd out
          zip -r "nfe_alert-${{ steps.set-date.outputs.date }}.zip" nfe_alert
          sha256sum "nfe_alert-${{ steps.set-date.outputs.date }}.zip" > "nfe_alert-${{ steps.set-date.outputs.date }}.zip.sha256"

      - name: Publicar en Release (asset)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/nfe_alert-${{ steps.set-date.outputs.date }}.zip
            out/nfe_alert-${{ steps.set-date.outputs.date }}.zip.sha256
          overwrite_files: true
          tag_name: "release-${{ steps.set-date.outputs.date }}"
          name: "Release ${{ steps.set-date.outputs.date }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
