name: Build and Release

permissions:
  contents: write

on:
    push:
        branches:
            - main
    pull_request:
        types: [closed]
        branches:
            - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare zip (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zip -r release.zip . -x ".git/*" ".github/*"

      - name: Create GitHub Release (only on tag)
        # if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    #   - name: Skip release creation for non-tags
        # if: startsWith(github.ref, 'refs/tags/') == false
        # run: |
        #   echo "Not a tag push; skipping release creation."
