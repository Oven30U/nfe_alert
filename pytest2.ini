[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
asyncio_mode = auto
markers =
    smoke: validaciones rápidas y críticas
    unit: pruebas unitarias sin I/O real
    integration: interacción entre componentes con dependencias simuladas
    e2e: pruebas end-to-end contra portales reales
    live: requiere red, navegador y credenciales reales
    known_issue: defecto conocido documentado
    credentials: escenarios de credenciales inválidas
    timeout: escenarios de timeout o indisponibilidad
